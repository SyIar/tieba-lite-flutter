name: Build unsigned iOS app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'
  FLUTTER_REVISION: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        shell: bash
        run: bash scripts/install_flutter_ci.sh
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localized resources
        run: flutter gen-l10n
      - name: Check repository policy
        run: python3 scripts/check_repository.py
      - name: Analyze Dart source
        run: flutter analyze --no-pub
      - name: Verify protocol and account isolation
        run: flutter test --no-pub
      - name: Build shared UI
        run: flutter build web --release --no-pub

  ios:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        shell: bash
        run: bash scripts/install_flutter_ci.sh
      - name: Report build tools
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          flutter --version
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localized resources
        run: flutter gen-l10n
      - name: Compile unsigned iOS device app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign --no-pub --build-number "$GITHUB_RUN_NUMBER"
      - name: Package and verify IPA
        shell: bash
        run: bash scripts/package_ios.sh
      - name: Upload IPA and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: TiebaLite-iOS-unsigned-${{ github.run_number }}
          path: |
            artifacts/TiebaLite-unsigned.ipa
            artifacts/SHA256SUMS
            artifacts/build-info.json
          if-no-files-found: error
          retention-days: 7
