name: Build native Swift iOS app
on:
  workflow_dispatch:
    inputs:
      core_only:
        type: boolean
        default: false
        description: Run the protocol and migration checks without packaging
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: python3 scripts/check_repository.py
      - run: xcrun swiftc -frontend -parse native/App/*.swift native/Core/*.swift
      - run: brew install protobuf xcodegen
      - run: python3 scripts/generate_native_protos.py
      - run: swift test --package-path native
      - if: ${{ !inputs.core_only }}
        run: xcodegen generate --spec native/project.yml
      - name: Compile native device app
        if: ${{ !inputs.core_only }}
        run: xcodebuild -project native/TiebaLite.xcodeproj -scheme TiebaLite -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath native/build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=$((1000 + GITHUB_RUN_NUMBER)) build
      - if: ${{ !inputs.core_only }}
        run: python3 scripts/package_native.py
      - if: ${{ !inputs.core_only }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: TiebaLite-native-unsigned-${{ github.run_number }}
          path: artifacts/native/
          if-no-files-found: error
          retention-days: 14
